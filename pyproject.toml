[project]
name = "cadabra-ai-platform"
version = "0.1.0"
description = "Cadabra AI Platform: agentes de IA multiempresa sobre WhatsApp Business Platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis>=5.2",
  "taskiq>=0.11",
  "taskiq-redis>=1.0",
  "httpx>=0.28",
  "langgraph>=0.2",
  "langchain-openai>=0.2",
  "tzdata>=2024.1",            # zonas horarias (America/Santiago) en Windows e imágenes slim
  "pypdf>=5.1",                # texto de los PDF que mandan los clientes
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "fakeredis>=2.26"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# Reglas fijas del proyecto (los valores por defecto de ruff cambian entre versiones).
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "BLE", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]   # textos en español con tildes, comillas y emojis
